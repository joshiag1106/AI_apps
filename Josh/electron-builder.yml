# Packaging configuration for electron-builder.
#
# The one setting that must never be removed is `asarUnpack` for the native
# PTY binary: a .node file cannot be loaded from inside an asar archive, so
# packaging it there produces an app that runs fine in development and fails
# on every user's machine.

appId: com.josh.terminal
productName: Josh
copyright: Copyright (c) Josh Contributors

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/{test,__tests__,tests,example,examples,doc,docs}/**"

asar: true
asarUnpack:
  - "**/node_modules/@lydell/node-pty*/**"

# Reproducibility: never silently rebuild native modules at package time.
npmRebuild: false
buildDependenciesFromSource: false

mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # No arch list here on purpose. An explicit list overrides the --x64 /
  # --arm64 flag CI passes, so every build produced both architectures from a
  # single runner's node_modules - which is how an arm64 pty.node ended up
  # inside the Intel installer in v1.0.0 and v1.0.1. Leaving it out lets the
  # command line decide, and CI builds each architecture on its own machine.
  target:
    - dmg
    - zip

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Josh
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

linux:
  category: System
  synopsis: A fast, secure, cross-platform terminal emulator
  maintainer: Josh Contributors <noreply@example.com>
  target:
    - AppImage
    - deb
  desktop:
    entry:
      Name: Josh
      Comment: A fast, secure terminal with tabs and split panes
      Categories: System;TerminalEmulator;
      Keywords: shell;prompt;command;commandline;

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
