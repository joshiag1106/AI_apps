# Builds every installer on a runner of the architecture it targets.
#
# This is a correctness requirement, not a preference. The PTY binding ships
# prebuilt binaries as platform-specific optional dependencies, and npm
# installs only the one matching the machine doing the install. Building both
# architectures from a single runner therefore produces one working installer
# and one that carries the wrong binary and cannot open a shell at all.
#
# That is exactly what shipped in v1.0.0 and v1.0.1: the Intel macOS build
# carried an arm64 pty.node because macos-latest is Apple silicon. The
# "verify the shipped native binary" step below is the guard that makes it
# impossible to ship that again.
#
# The app lives in the Josh/ subdirectory, so `run` steps default there. Steps
# using an action rather than a shell need the Josh/ prefix spelled out.

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      dry_run_release:
        description: >-
          Exercise the release job without publishing anything. Builds every
          installer, then runs the download and publish steps against a draft
          release, so the release path can be proven before a tag depends on it.
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: Josh

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is Intel, macos-latest is Apple silicon. Both are
        # tested because the native binding differs between them. (macos-13
        # was retired by GitHub on 2025-12-04; macos-15-intel is its
        # replacement for Intel coverage, supported until Fall 2027.)
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Josh/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm 11 blocks dependency lifecycle scripts, which stops Electron's
      # binary from downloading. The preflight repairs that; approving it here
      # keeps the log honest about what ran.
      - name: Approve Electron install script
        run: npm approve-scripts electron || true

      # Downloads the Electron binary if npm's script blocking left it missing.
      # Must run before the sandbox step, which touches a file that does not
      # exist until Electron is installed.
      - name: Preflight
        run: npm run verify

      # The app calls app.enableSandbox(), so Electron refuses to start unless
      # its SUID helper is root-owned with mode 4755. npm cannot set that.
      # Fixing the permissions keeps the smoke test exercising the real
      # sandboxed configuration rather than passing --no-sandbox.
      - name: Configure Electron sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # The smoke test boots Electron, which needs a display server on Linux.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test

      - name: Run tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm test

  dist:
    name: package (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel # Intel
            command: dist:mac
            arch: x64
            artifact: macos-x64
          - os: macos-latest # Apple silicon
            command: dist:mac
            arch: arm64
            artifact: macos-arm64
          - os: ubuntu-latest
            command: dist:linux
            arch: x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            command: dist:linux
            arch: arm64
            artifact: linux-arm64
          - os: windows-latest
            command: dist:win
            arch: x64
            artifact: windows-x64
          - os: windows-11-arm
            command: dist:win
            arch: arm64
            artifact: windows-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Josh/package-lock.json

      - run: npm ci

      - name: Approve Electron install script
        run: npm approve-scripts electron || true

      - name: Preflight
        run: npm run verify

      - name: Generate application icon
        run: npm run icon

      # --publish never keeps electron-builder from configuring a GitHub
      # publisher; uploading is this workflow's job. The architecture flag is
      # what restricts the build to this runner's own architecture, and it
      # only works because electron-builder.yml no longer hard-codes an arch
      # list per target.
      # Signing is opt-in and degrades cleanly. Secrets are unreadable from
      # forked pull requests and absent until someone configures them, so the
      # build must still work without them — an unsigned artifact is a warning
      # for the downloader, but a build that fails outright helps nobody.
      #
      # Secrets cannot be referenced in an `if:` expression, so presence is
      # detected here and exposed as a step output instead.
      - name: Detect macOS signing availability
        id: signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID certificate found - this build will be signed and notarized."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No MACOS_CERTIFICATE secret - building unsigned (expected for forks and PRs)."
          fi

      # `--config.mac.notarize=true` is passed on the command line rather than
      # set in electron-builder.yml, because notarization declared in config
      # fails the build when no Apple credentials are present. Adding it only
      # for signed runs keeps the unsigned path byte-for-byte as it was.
      # An absent secret expands to the empty string, which still *defines*
      # the variable. electron-builder reads a defined CSC_LINK as a path to a
      # certificate, resolves the empty value to the working directory, and
      # fails with "not a file". Unsetting the whole group when there is
      # nothing to sign with is what makes the unsigned path work.
      #
      # This never showed up in a pull request because electron-builder skips
      # signing outright on PR builds ("Current build is a part of pull
      # request, code signing will be skipped"), so CSC_LINK was never read.
      # A tag is the first build that reads it, which is why v1.0.4 failed
      # here and every PR before it passed. Run the dry run, not a tag, to
      # exercise this path.
      - name: Build installer
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run ${{ matrix.command }} -- --${{ matrix.arch }} --publish never ${{ steps.signing.outputs.enabled == 'true' && '--config.mac.notarize=true' || '' }}
        # Explicit, because the default shell on the Windows runners is
        # PowerShell, which has no `unset` and no `[`. bash ships on every
        # GitHub runner, so one script serves all six.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.enabled == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Signing that silently did nothing is the failure mode worth guarding:
      # electron-builder logs a warning and produces an unsigned app, which
      # looks like success until a user hits Gatekeeper. `spctl` is the check
      # Gatekeeper itself performs, so this asserts the actual outcome rather
      # than trusting that the signing step ran.
      - name: Verify the macOS build is signed and accepted by Gatekeeper
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        run: |
          set -e
          app=$(find dist -name '*.app' -maxdepth 3 | head -1)
          if [ -z "$app" ]; then echo "No .app found in dist/"; exit 1; fi
          echo "checking: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          echo "Signed, notarized and accepted by Gatekeeper."

      # The guard for the bug described at the top of this file. A mismatch
      # means the installer would launch and then fail to open a shell, which
      # no unit test can detect: the tests run against the runner's own
      # node_modules, never the packaged bundle.
      - name: Verify the shipped native binary matches the target architecture
        if: runner.os != 'Windows'
        run: |
          set -e
          binary=$(find dist -name 'pty.node' | head -1)
          if [ -z "$binary" ]; then
            echo "No pty.node found in dist/ - the native module was not packaged."
            exit 1
          fi
          info=$(file -b "$binary")
          echo "packaged: $binary"
          echo "reports:  $info"
          case "${{ matrix.arch }}" in
            x64)
              echo "$info" | grep -Eq 'x86[_-]64' \
                || { echo "MISMATCH: expected x86_64 for an x64 build"; exit 1; } ;;
            arm64)
              echo "$info" | grep -Eq 'arm64|aarch64' \
                || { echo "MISMATCH: expected arm64 for an arm64 build"; exit 1; } ;;
          esac
          echo "Architecture matches the build target."

      # The Windows counterpart of the guard above. Packaging config is easy to
      # get subtly wrong in a way that still produces a working installer — one
      # missing extraResources entry and sed/awk are simply absent, which no
      # unit test can see. Running them proves they were packaged *and* work.
      - name: Verify the bundled sed/awk fallback was packaged (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sed = Get-ChildItem -Recurse -Path dist -Filter 'sed.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $awk = Get-ChildItem -Recurse -Path dist -Filter 'awk.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sed) { Write-Error 'sed.exe was not packaged into dist/'; exit 1 }
          if (-not $awk) { Write-Error 'awk.exe was not packaged into dist/'; exit 1 }
          Write-Host "found: $($sed.FullName)"
          Write-Host "found: $($awk.FullName)"

          $sedOut = 'hello' | & $sed.FullName -e 's/hello/world/'
          if ($sedOut -ne 'world') { Write-Error "sed.exe did not transform input (got: '$sedOut')"; exit 1 }

          $awkOut = '1 2 3' | & $awk.FullName '{print $2}'
          if ($awkOut -ne '2') { Write-Error "awk.exe did not extract the expected field (got: '$awkOut')"; exit 1 }

          Write-Host 'sed/awk fallback packaged and runnable.'

      - uses: actions/upload-artifact@v7
        with:
          name: josh-${{ matrix.artifact }}
          retention-days: 14
          path: |
            Josh/dist/*.dmg
            Josh/dist/*.zip
            Josh/dist/*.exe
            Josh/dist/*.AppImage
            Josh/dist/*.deb

  # The release job is the only place download-artifact and action-gh-release
  # run, and a tag push is a bad moment to discover either of them is broken.
  # `dry_run_release` runs this same job on demand -- the real one, not a copy.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run_release
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The body is written by hand because these builds are unsigned: without
      # instructions, every downloader hits a Gatekeeper or SmartScreen block
      # and reasonably concludes the app is broken or malicious.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Fail-safe rather than input-driven: anything not triggered by a
          # real version tag can only ever produce a draft, so a dry run cannot
          # publish even if its input is wrong. A draft holds its tag name
          # without creating the ref, so no tag is left behind either.
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}
          body: |
            **Josh** is a fast, secure, cross-platform terminal emulator: real
            PTYs, GPU-accelerated rendering, tabs and split panes.

            ### Which file do I want?

            | Platform | File |
            | --- | --- |
            | macOS, Apple silicon | `Josh-<version>-arm64.dmg` |
            | macOS, Intel | `Josh-<version>-x64.dmg` |
            | Windows | `Josh-Setup-<version>-x64.exe`, or the portable build |
            | Linux | `Josh-<version>-x86_64.AppImage` or `josh_<version>_amd64.deb` |

            Every installer is built on a machine of the architecture it
            targets, and the build fails if the packaged native binary does not
            match. Earlier releases cross-built their architectures from a
            single runner and shipped a native binary that could not load.

            ### These builds are not code-signed

            macOS Gatekeeper and Windows SmartScreen will warn you. That is
            expected — no signing certificates are configured for this
            repository — and not a sign the download is damaged.

            - **macOS 15 and later** — open the app, let it be blocked, then go
              to **System Settings → Privacy & Security**, scroll down and
              choose **Open Anyway**. The old right-click → Open shortcut was
              removed in macOS 15.
            - **macOS 14 and earlier** — right-click the app, choose **Open**,
              then confirm.
            - **Windows** — choose **More info**, then **Run anyway**.
            - **Linux** — `chmod +x Josh-*.AppImage` before running it.

            If you would rather not trust a binary, build it yourself. Every
            artifact here was produced from this tag by GitHub Actions on a
            clean runner, and the build log is public.
